<p-toast />

<body>
  <div class="contenedor-principal">
    <div>
      <img src="../../assets/favicon.png" alt="logo centro de fomento" class="animacion-resplandor" height="250px">
    </div>

    <div class="login-container">
      <div class="login-header">
        <h1>Bienvenido de nuevo</h1>
        <p>Por favor, ingresa tus datos para continuar.</p>
      </div>
      <form (ngSubmit)="login()">
        <div class="form-group">
          <label for="username">Correo electrónico</label>
          <input type="text" id="username" name="username" placeholder="Ingresar usuario" [(ngModel)]="username"
            required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" name="password" placeholder="Ingresar contraseña" [(ngModel)]="password"
            required>
        </div>

        <p-button type="submit" pRipple label="Iniciar sesión" />
      </form>
      <div class="forgot-password">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

    </div>
  </div>
</body>
